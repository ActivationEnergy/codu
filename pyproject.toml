[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codu"
dynamic = ["version"]
description = "Browse and manage local Codex sessions in an ncdu-style TUI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "ActivationEnergy", email = "244162811+ActivationEnergy@users.noreply.github.com" },
]
keywords = ["codex", "sessions", "terminal", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "windows-curses>=2.4.2; sys_platform == 'win32'",
]

[project.scripts]
codu = "codu:main"

[project.urls]
Homepage = "https://github.com/ActivationEnergy/codu"
Issues = "https://github.com/ActivationEnergy/codu/issues"

[tool.setuptools]
py-modules = ["codu"]

[tool.setuptools.dynamic]
version = { attr = "codu.__version__" }

[tool.ruff]
target-version = "py311"
